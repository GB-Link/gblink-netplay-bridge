appId: com.gblink.bridge
productName: GBLink Netplay Bridge
executableName: gblink-bridge

# The usb and serialport modules ship N-API prebuilds that are ABI-stable
# under Electron; rebuilding from source would require libudev headers on
# the build host.
npmRebuild: false

directories:
  buildResources: build
  output: release

files:
  - dist/main/**
  - dist/preload/**
  - dist/renderer/**
  - package.json

asarUnpack:
  - node_modules/usb/**
  - node_modules/serialport/**
  - node_modules/@serialport/**

extraResources:
  - from: resources/70-gblink.rules
    to: 70-gblink.rules

win:
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: ${name}-${version}-Windows-Setup.${ext}

# Arch words are normalized to Intel / AppleSilicon / x86_64 afterwards.
appImage:
  artifactName: ${name}-${version}-Linux-${arch}.${ext}

dmg:
  artifactName: ${name}-${version}-macOS-${arch}.${ext}

afterPack: scripts/afterPackMacSign.cjs
afterAllArtifactBuild: scripts/afterAllArtifactBuild.cjs

mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.games
  # No signing certificate: skip electron-builder's signing (the afterPack
  # hook ad-hoc reseals the bundle so Gatekeeper treats it as unsigned
  # rather than damaged).
  identity: null

linux:
  category: Game
  target:
    - target: AppImage
      arch: [x64, arm64]
