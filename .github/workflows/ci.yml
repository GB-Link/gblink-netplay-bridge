name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run typecheck:main
      - name: Install renderer deps
        run: npm ci
        working-directory: src/renderer
      - name: Build renderer
        run: npm run build
        working-directory: src/renderer
      - name: Build main/preload
        run: npm run build:main
