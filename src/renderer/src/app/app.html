<div class="flex h-screen flex-col">
  <app-status-bar
    (deviceClick)="deviceOpen.set(true)"
    (gearClick)="settingsOpen.set(true)"
  />

  <main class="min-h-0 min-w-0 flex-1 overflow-y-auto">
    @if (bridge.sessionActive()) {
      <app-session-view class="block h-full" />
    } @else {
      <div class="mx-auto max-w-3xl p-6 max-sm:p-3">
        @if (closeNotice(); as notice) {
          <div
            class="mb-4 flex items-start justify-between gap-3 rounded-lg border px-3 py-2 text-sm"
            [class]="notice.graceful
              ? 'border-neutral-200 bg-white text-neutral-600 dark:border-neutral-800 dark:bg-neutral-900 dark:text-neutral-300'
              : 'border-amber-400 bg-amber-50 text-amber-800 dark:border-amber-600 dark:bg-amber-950 dark:text-amber-200'"
          >
            <span>
              {{ notice.text }}
              @if (notice.detail) {
                <span class="opacity-70"> — {{ notice.detail }}</span>
              }
            </span>
            <button
              (click)="dismissNotice()"
              class="shrink-0 text-base leading-none opacity-60 hover:opacity-100"
              aria-label="Dismiss"
            >&times;</button>
          </div>
        }
        <app-play-card />
        <app-lobby-list class="mt-6 block" />
      </div>
    }
  </main>

  <app-log-drawer />

  @if (settingsOpen()) {
    <app-settings-modal (closed)="settingsOpen.set(false)" />
  }
  @if (deviceOpen()) {
    <app-device-drawer (closed)="deviceOpen.set(false)" />
  }
</div>
